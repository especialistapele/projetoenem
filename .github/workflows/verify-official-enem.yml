name: Verify official ENEM PDF ingestion

on:
  push:
    branches:
      - repair/official-pdf-integration
  workflow_dispatch:

jobs:
  official-pdf-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and validate official INEP PDFs
        run: python scripts/verify_official_enem.py
